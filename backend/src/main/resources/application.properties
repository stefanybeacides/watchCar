spring.application.name=watchCar
jwt.secret=usersecret
jwt.expiration=3600000

spring.main.allow-bean-definition-overriding=true

# Configuração Oracle
spring.datasource.url=jdbc:oracle:thin:@localhost:1522/WATCHCAR
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=ads
spring.datasource.password=ads
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Dialeto do Oracle
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect

# Configurações JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desativa o H2 Console e banco em memória
spring.h2.console.enabled=false
spring.datasource.initialization-mode=never
